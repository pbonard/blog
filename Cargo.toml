[workspace]
resolver = "3"
members = ["crates/*"]
# cargo run without -p
default-members = ["crates/draft"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
site = { path = "crates/site" }
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
jiff = { version = "1.0.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
toml = { version = "1.2.2", default-features = false, features = ["parse", "serde", "std"] }

[profile.dev.package."*"]
opt-level = 2 # syntax highlighting is slow without optimisation
